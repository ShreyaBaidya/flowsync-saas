<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Flowsync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="theme.css" />
  <script>
    (function(){var t=localStorage.getItem('flowsync-theme')||
    (window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
    document.documentElement.setAttribute('data-theme',t);})();
  </script>
</head>
<body class="auth-page">

<!-- Shared SVG gradient defs — used by [data-theme="light"] .logo-bg -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="fsLogoLight" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A9D8F"/>
      <stop offset="1" stop-color="#38B2A3"/>
    </linearGradient>
  </defs>
</svg>

  <header class="navbar scrolled" id="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="8" fill="url(#logoGradSU)" class="logo-bg"/>
          <path d="M8 14l4 4 8-8" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="logoGradSU" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6C63FF"/>
              <stop offset="1" stop-color="#3B82F6"/>
            </linearGradient>
          </defs>
        </svg>
        <span>Flowsync</span>
      </a>
      <div class="nav-actions">
        <div id="navThemeToggle"></div>
        <span class="auth-nav-hint">Already have an account?</span>
        <a href="signin.html" class="btn-ghost">Sign in</a>
      </div>
    </div>
  </header>

  <main class="auth-layout">
    <div class="auth-bg-glow"></div>

    <div class="auth-card">
      <div class="auth-header">
        <h1>Create your account</h1>
        <p>Start your 14-day free trial — no credit card needed</p>
      </div>



      <form class="auth-form" id="signupForm" novalidate>

        <!-- Full name -->
        <div class="form-group" id="nameGroup">
          <label for="fullName" class="form-label">Full name</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <input type="text" id="fullName" name="fullName" class="form-input" placeholder="Jane Smith" autocomplete="name" aria-describedby="nameError" />
          </div>
          <span class="form-error" id="nameError" role="alert"></span>
        </div>

        <!-- Work email -->
        <div class="form-group" id="emailGroup">
          <label for="email" class="form-label">Work email</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12v8a1 1 0 01-1 1H3a1 1 0 01-1-1V4zm0 0l6 5 6-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="email" id="email" name="email" class="form-input" placeholder="you@company.com" autocomplete="email" aria-describedby="emailError" />
          </div>
          <span class="form-error" id="emailError" role="alert"></span>
        </div>

        <!-- Password -->
        <div class="form-group" id="passwordGroup">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M5 7V5a3 3 0 016 0v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <input type="password" id="password" name="password" class="form-input" placeholder="Min. 8 characters" autocomplete="new-password" aria-describedby="passwordError" />
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
              <svg id="eyeOpen" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/></svg>
              <svg id="eyeClosed" width="16" height="16" viewBox="0 0 16 16" fill="none" style="display:none"><path d="M2 2l12 12M6.5 6.5A2 2 0 0010 10M4.5 4.5C3 5.5 2 7 2 7s2.5 5 6 5a6.5 6.5 0 003-.7M7 3.1A6.6 6.6 0 0114 9s-.6 1.4-1.8 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
          </div>
          <span class="form-error" id="passwordError" role="alert"></span>
          <!-- Password strength bar -->
          <div class="password-strength" id="strengthBar" style="display:none">
            <div class="strength-track"><div class="strength-fill" id="strengthFill"></div></div>
            <span class="strength-label" id="strengthLabel"></span>
          </div>
        </div>

        <!-- Terms -->
        <div class="form-check" id="termsGroup">
          <label class="checkbox-label">
            <input type="checkbox" id="agreeTerms" name="agreeTerms" />
            <span class="checkbox-custom"></span>
            I agree to the <a href="#" class="form-link">Terms of Service</a> and <a href="#" class="form-link">Privacy Policy</a>
          </label>
          <span class="form-error" id="termsError" role="alert" style="margin-top:4px;display:block;"></span>
        </div>

        <button type="submit" class="btn-primary btn-lg btn-submit" id="submitBtn">
          <span class="btn-text">Create free account</span>
          <span class="btn-spinner" style="display:none;">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="spin"><circle cx="8" cy="8" r="6" stroke="rgba(255,255,255,0.3)" stroke-width="2"/><path d="M8 2a6 6 0 016 6" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
        </button>
      </form>

      <div class="auth-divider"><span>or sign up with</span></div>

      <div class="social-auth">
        <button type="button" class="social-btn" id="googleBtn">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M17.1 9.2c0-.6-.1-1.2-.2-1.7H9v3.2h4.5a3.8 3.8 0 01-1.7 2.5v2h2.7c1.6-1.5 2.6-3.6 2.6-6z" fill="#4285F4"/><path d="M9 18c2.3 0 4.2-.7 5.5-2l-2.7-2a5.4 5.4 0 01-8-2.8H1v2.1A9 9 0 009 18z" fill="#34A853"/><path d="M3.8 11.2A5.3 5.3 0 013.8 9 5.3 5.3 0 014 8H1V6A9 9 0 000 9a9 9 0 001 4l2.8-1.8z" fill="#FBBC05"/><path d="M9 3.6c1.3 0 2.4.4 3.3 1.3l2.4-2.4A9 9 0 001 6l2.8 2.1A5.4 5.4 0 019 3.6z" fill="#EA4335"/></svg>
          Google
        </button>
        <button type="button" class="social-btn" id="githubBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          GitHub
        </button>
      </div>

      <p class="auth-footer-text">
        Already have an account? <a href="signin.html" class="form-link">Sign in</a>
      </p>
    </div>
  </main>

  <script src="auth-state.js"></script>
  <script src="theme.js"></script>
  <script src="auth.js"></script>
</body>
</html>
